<body class="bg-background min-h-screen flex flex-col justify-center items-center p-gutter-mobile md:p-gutter-desktop antialiased">
<!-- Main Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Wordmark -->
<div class="mb-space-8 text-center">
<h1 class="font-display-md text-display-md text-primary font-bold tracking-tight">TutorDesk</h1>
<p class="font-body text-body text-ink-500 mt-space-1">Independent Operations</p>
</div>
<!-- Sign Up Card -->
<div class="w-full bg-paper-0 border border-paper-200 rounded-lg p-space-6 shadow-[0_4px_24px_-4px_rgba(22,33,30,0.08)]">
<h2 class="font-title-lg text-title-lg text-on-surface mb-space-2 text-center">Create account</h2>
<p class="font-body text-body text-ink-500 mb-space-6 text-center">Start managing your classes today.</p>
<form class="flex flex-col gap-space-4">
<!-- Full Name Field -->
<div>
<label class="block font-label text-label text-ink-700 mb-space-1" for="fullName">Full Name</label>
<input class="w-full bg-paper-0 border border-paper-300 rounded text-body font-body text-on-surface px-space-3 py-space-2 placeholder:text-ink-500/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-colors" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
<!-- Email Field -->
<div>
<label class="block font-label text-label text-ink-700 mb-space-1" for="email">Email Address</label>
<input class="w-full bg-paper-0 border border-paper-300 rounded text-body font-body text-on-surface px-space-3 py-space-2 placeholder:text-ink-500/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-colors" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- Phone Field with +234 Default -->
<div>
<label class="block font-label text-label text-ink-700 mb-space-1" for="phone">Phone Number</label>
<div class="relative flex">
<span class="inline-flex items-center px-space-3 rounded-l border border-r-0 border-paper-300 bg-paper-50 text-ink-700 font-body text-body">
                            +234
                        </span>
<input class="w-full bg-paper-0 border border-paper-300 rounded-r text-body font-body text-on-surface px-space-3 py-space-2 placeholder:text-ink-500/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-colors z-10 relative" id="phone" name="phone" placeholder="801 234 5678" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label text-label text-ink-700 mb-space-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-paper-0 border border-paper-300 rounded text-body font-body text-on-surface px-space-3 py-space-2 pr-10 placeholder:text-ink-500/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-ink-500 hover:text-ink-700" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="font-caption text-caption text-ink-500 mt-space-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span> Must be at least 8 characters.
                    </p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label text-label py-space-3 rounded transition-colors mt-space-2" type="submit">
                    Create account
                </button>
</form>
<!-- Login Link -->
<div class="mt-space-6 text-center">
<p class="font-body text-body text-ink-500">
                    Already have an account? 
                    <a class="text-primary hover:text-on-primary-fixed-variant font-medium underline-offset-4 hover:underline transition-colors" href="#">Log in</a>
</p>
</div>
</div>
<!-- Footer / Legal -->
<p class="font-caption text-caption text-ink-500 mt-space-6 text-center max-w-xs">
            By creating an account, you agree to our <a class="underline hover:text-ink-700" href="#">Terms of Service</a> and <a class="underline hover:text-ink-700" href="#">Privacy Policy</a>.
        </p>
</main>
<script>
        // Simple password toggle logic
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('span');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
    </script>

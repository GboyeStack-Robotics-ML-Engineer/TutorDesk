        .fade-in {
            animation: fadeIn 1.5s ease-in forwards;
            opacity: 0;
        }

        .pulse-dot {
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(185, 121, 26, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(185, 121, 26, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(185, 121, 26, 0); }
        }
    </style>

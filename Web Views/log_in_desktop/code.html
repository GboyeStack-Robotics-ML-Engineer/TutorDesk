<body class="bg-background text-on-background font-body min-h-screen flex items-center justify-center p-gutter-mobile md:p-gutter-desktop antialiased">
<!-- Login Container -->
<main class="w-full max-w-[400px]">
<!-- Brand Header -->
<div class="text-center mb-space-8">
<h1 class="font-display-md text-display-md font-bold text-primary tracking-tight">TutorDesk</h1>
</div>
<!-- Login Card -->
<div class="bg-paper-0 border border-paper-200 rounded-lg p-space-6 md:p-space-8 shadow-sm">
<div class="mb-space-6 text-center">
<h2 class="font-title-md text-title-md text-ink-900">Welcome back</h2>
<p class="font-body text-body text-ink-500 mt-space-1">Please enter your details to sign in.</p>
</div>
<form action="#" class="space-y-space-4" method="POST">
<!-- Email/Phone Field -->
<div>
<label class="block font-label text-label text-ink-700 mb-space-2" for="identifier">Email or Phone number</label>
<div class="relative">
<input class="block w-full font-body text-body bg-surface-container-lowest border border-outline-variant rounded px-space-3 py-2 text-ink-900 placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="identifier" name="identifier" placeholder="e.g., tutor@example.com" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-space-2">
<label class="block font-label text-label text-ink-700" for="password">Password</label>
<a class="font-label text-label text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="block w-full font-body text-body bg-surface-container-lowest border border-outline-variant rounded px-space-3 py-2 text-ink-900 placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-space-2">
<button class="w-full flex justify-center items-center gap-space-2 bg-primary text-on-primary font-label text-label py-2.5 px-space-4 rounded border border-transparent hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background transition-colors" type="submit">
                        Log in
                    </button>
</div>
</form>
<!-- Secondary Action -->
<div class="mt-space-6 text-center">
<p class="font-body text-body text-ink-500">
                    Don't have an account? 
                    <a class="font-label text-label text-primary hover:underline transition-all" href="#">Create account</a>
</p>
</div>
</div>
</main>
</body></html>

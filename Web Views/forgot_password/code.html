<body class="bg-paper-50 min-h-screen flex items-center justify-center p-gutter-mobile">
<!-- Note: Transactional screen, Navigation Shells suppressed per rules -->
<main class="w-full max-w-md">
<!-- Brand Logo (Contextual) -->
<div class="text-center mb-space-8">
<h1 class="font-display-md text-display-md text-primary">TutorFlow</h1>
</div>
<!-- Forgot Password Card -->
<div class="bg-paper-0 border border-paper-200 rounded-lg p-space-6 shadow-[0_4px_12px_rgba(22,33,30,0.06)]">
<!-- Header Text -->
<div class="mb-space-6 text-center">
<h2 class="font-title-lg text-title-lg text-on-surface mb-space-2">Reset Password</h2>
<p class="font-body text-body text-on-surface-variant">
                    Enter your email address or phone number, and we'll send you a link to get back into your account.
                </p>
</div>
<!-- Form -->
<form action="#" class="space-y-space-4" method="POST">
<!-- Input Field -->
<div>
<label class="block font-label text-label text-on-surface mb-space-1" for="contact_info">Email or Phone Number</label>
<input class="w-full font-body text-body text-on-surface bg-paper-0 border border-paper-300 rounded-DEFAULT px-space-3 py-space-2 focus:outline-none focus:border-surface-tint focus:ring-1 focus:ring-surface-tint placeholder:text-outline-variant transition-colors" id="contact_info" name="contact_info" placeholder="e.g. name@example.com" required="" type="text">
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label text-label py-space-3 px-space-4 rounded-DEFAULT hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200 flex justify-center items-center gap-space-2" type="submit">
                    Send reset link
                </button>
</form>
<!-- Secondary Action -->
<div class="mt-space-6 text-center">
<a class="inline-flex items-center gap-space-1 font-label text-label text-surface-tint hover:text-primary transition-colors" href="/login">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>

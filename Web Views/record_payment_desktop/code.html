<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E5E2D8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #CFCABB;
        }

        /* Subtle shadow for the modal */
        .shadow-modal {
            box-shadow: 0 10px 40px -10px rgba(22, 33, 30, 0.08), 0 0 0 1px rgba(22, 33, 30, 0.05);
        }

        /* Radio button custom styling */
        input[type="radio"]:checked + div {
            border-color: #005248;
            background-color: #F1EFE8;
        }
        input[type="radio"]:checked + div .radio-icon {
            color: #005248;
        }

<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-gutter-mobile md:p-gutter-desktop antialiased relative">
<!-- Background Overlay (Simulating modal backdrop) -->
<div class="fixed inset-0 bg-ink-900/10 backdrop-blur-sm z-0"></div>
<!-- Modal Container -->
<main class="w-full max-w-lg bg-paper-0 rounded-xl shadow-modal relative z-10 border border-paper-200 overflow-hidden flex flex-col max-h-[921px]">
<!-- Header -->
<header class="px-space-6 py-space-4 border-b border-paper-200 flex justify-between items-center shrink-0">
<div>
<h1 class="font-title-lg text-title-lg text-primary">Record Payment</h1>
<p class="font-body text-body text-ink-500 mt-1">Invoice #INV-2023-089 • Student: <span class="font-title-sm text-title-sm text-ink-700">Chioma Adebayo</span></p>
</div>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-paper-100 text-ink-500 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Scrollable Content Area -->
<div class="p-space-6 overflow-y-auto flex-grow space-y-space-8">
<!-- Amount & Date Section -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-space-4">
<div class="space-y-space-2">
<label class="block font-label text-label text-ink-700" for="amount">Amount Received</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 font-data-display text-data-display text-ink-500">₦</span>
<input class="w-full pl-8 pr-3 py-2 bg-paper-0 border border-paper-300 rounded-DEFAULT font-data-display text-data-display text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-colors" id="amount" placeholder="0.00" type="text" value="45,000.00"/>
</div>
</div>
<div class="space-y-space-2">
<label class="block font-label text-label text-ink-700" for="payment_date">Payment Date</label>
<div class="relative">
<input class="w-full pl-3 pr-10 py-2 bg-paper-0 border border-paper-300 rounded-DEFAULT font-data-display text-data-display text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-colors" id="payment_date" type="date" value="2023-10-24"/>
</div>
</div>
</section>
<!-- Payment Method Selection -->
<section class="space-y-space-3">
<label class="block font-label text-label text-ink-700">Payment Method</label>
<div class="grid grid-cols-3 gap-space-3">
<label class="cursor-pointer relative">
<input checked="" class="sr-only" name="payment_method" type="radio" value="bank_transfer"/>
<div class="h-full border border-paper-300 rounded-lg p-space-3 flex flex-col items-center justify-center text-center gap-space-2 hover:border-paper-300/80 transition-colors bg-paper-0">
<span class="material-symbols-outlined text-ink-500 radio-icon">account_balance</span>
<span class="font-label text-label text-ink-700">Transfer</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="sr-only" name="payment_method" type="radio" value="cash"/>
<div class="h-full border border-paper-300 rounded-lg p-space-3 flex flex-col items-center justify-center text-center gap-space-2 hover:border-paper-300/80 transition-colors bg-paper-0">
<span class="material-symbols-outlined text-ink-500 radio-icon">payments</span>
<span class="font-label text-label text-ink-700">Cash</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="sr-only" name="payment_method" type="radio" value="card"/>
<div class="h-full border border-paper-300 rounded-lg p-space-3 flex flex-col items-center justify-center text-center gap-space-2 hover:border-paper-300/80 transition-colors bg-paper-0">
<span class="material-symbols-outlined text-ink-500 radio-icon">credit_card</span>
<span class="font-label text-label text-ink-700">Card</span>
</div>
</label>
</div>
</section>
<!-- Reference & Notes -->
<section class="space-y-space-4">
<div class="space-y-space-2">
<label class="block font-label text-label text-ink-700" for="reference">Reference / Transaction ID <span class="text-ink-500 font-normal">(Optional)</span></label>
<input class="w-full px-3 py-2 bg-paper-0 border border-paper-300 rounded-DEFAULT font-data-display text-data-display text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-colors" id="reference" placeholder="e.g. GTB/TRF/092..." type="text"/>
</div>
<div class="space-y-space-2">
<label class="block font-label text-label text-ink-700" for="notes">Internal Note <span class="text-ink-500 font-normal">(Optional)</span></label>
<textarea class="w-full px-3 py-2 bg-paper-0 border border-paper-300 rounded-DEFAULT font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white transition-colors resize-none" id="notes" placeholder="Add a private note regarding this payment..." rows="2"></textarea>
</div>
</section>
<!-- Invoice Status Toggle -->
<section class="p-space-4 bg-paper-100 rounded-lg border border-paper-200 flex items-center justify-between">
<div>
<h3 class="font-title-sm text-title-sm text-ink-900">Mark invoice as paid</h3>
<p class="font-caption text-caption text-ink-500 mt-1">Updates student balance and sends receipt.</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-paper-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-paper-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</section>
</div>
<!-- Footer Actions -->
<footer class="px-space-6 py-space-4 border-t border-paper-200 bg-surface-bright flex justify-end gap-space-3 shrink-0">
<button class="px-space-4 py-2 rounded-DEFAULT font-label text-label text-ink-700 border border-paper-300 bg-paper-0 hover:bg-paper-100 transition-colors">
                Cancel
            </button>
<button class="px-space-4 py-2 rounded-DEFAULT font-label text-label text-white bg-primary hover:bg-primary-container transition-colors flex items-center gap-space-2">
<span class="material-symbols-outlined text-[18px]">save</span>
                Record Payment
            </button>
</footer>
</main>
</body></html>

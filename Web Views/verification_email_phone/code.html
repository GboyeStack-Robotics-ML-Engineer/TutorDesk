<style>

            width: 48px;

            text-align: center;
            border: 1px solid theme('colors.paper-300');
            background-color: theme('colors.paper-0');
            border-radius: theme('borderRadius.DEFAULT');
            outline: none;
            transition: all 0.2s ease;

<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- Main Content Area -->

<p class="font-body text-body text-on-surface-variant">
                    We've sent a 6-digit security code to <br/>
<strong class="font-medium text-on-surface">tutor.flow@example.com</strong>
</p>

<!-- Verification Form -->
<form class="space-y-space-6" id="verification-form">
<div class="flex justify-between gap-space-2 sm:gap-space-3" id="otp-container">
<input aria-label="Digit 1" autofocus="" class="verification-input font-data-display text-data-display text-lg" maxlength="1" type="number"/>
<input aria-label="Digit 2" class="verification-input font-data-display text-data-display text-lg" maxlength="1" type="number"/>
<input aria-label="Digit 3" class="verification-input font-data-display text-data-display text-lg" maxlength="1" type="number"/>
<input aria-label="Digit 4" class="verification-input font-data-display text-data-display text-lg" maxlength="1" type="number"/>
<input aria-label="Digit 5" class="verification-input font-data-display text-data-display text-lg" maxlength="1" type="number"/>
<input aria-label="Digit 6" class="verification-input font-data-display text-data-display text-lg" maxlength="1" type="number"/>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-label text-label py-3 rounded transition-colors duration-200 flex justify-center items-center gap-2" type="submit">
                    Verify Identity
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Actions & Cooldown -->
<div class="mt-space-8 text-center space-y-space-4">
<p class="font-body text-body text-on-surface-variant">
                    Didn't receive the code? 
                    <span class="font-data-display text-data-display text-primary ml-1" id="cooldown-timer">00:30</span>
<button class="hidden text-primary hover:text-primary-container font-label text-label underline underline-offset-4 ml-1 transition-colors" id="resend-btn">Resend Code</button>
</p>

<script>
        // OTP Input Logic
        const container = document.getElementById('otp-container');
        const inputs = container.querySelectorAll('input');

        inputs.forEach((input, index) => {
            // Prevent non-numeric input
            input.addEventListener('keypress', (e) => {
                if (e.key < '0' || e.key > '9') {
                    e.preventDefault();
                }
            });

            input.addEventListener('input', (e) => {
                const target = e.target;
                const val = target.value;
                
                // Clear extra characters
                if (val.length > 1) {
                    target.value = val.slice(0, 1);
                }

                if (val !== '') {
                    // Move to next input
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    } else {
                        // Auto submit if last input is filled
                        input.blur();
                        // Optional: trigger form submit here
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                const target = e.target;
                
                // Handle backspace
                if (e.key === 'Backspace' && target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
                
                // Handle left/right arrows
                if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Paste handling
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/\D/g, '');
                
                pastedData.split('').forEach((char, i) => {
                    if (i < inputs.length) {
                        inputs[i].value = char;
                        if (i === inputs.length - 1) {
                            inputs[i].focus();
                        } else {
                            inputs[i + 1].focus();
                        }
                    }
                });
            });
        });

        // Cooldown Timer Logic
        let timeLeft = 30;
        const timerElement = document.getElementById('cooldown-timer');
        const resendButton = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft.toString().padStart(2, '0');
            timerElement.textContent = `00:${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.classList.add('hidden');
                resendButton.classList.remove('hidden');
            }
        }, 1000);

        // Resend button simulation
        resendButton.addEventListener('click', () => {
            // Simulate API call
            resendButton.textContent = 'Sending...';
            resendButton.disabled = true;
            
            setTimeout(() => {
                timeLeft = 30;
                resendButton.classList.add('hidden');
                resendButton.textContent = 'Resend Code';
                resendButton.disabled = false;
                timerElement.classList.remove('hidden');
                timerElement.textContent = `00:30`;
                
                // Restart countdown
                const newCountdown = setInterval(() => {
                    timeLeft--;
                    const seconds = timeLeft.toString().padStart(2, '0');
                    timerElement.textContent = `00:${seconds}`;

                    if (timeLeft <= 0) {
                        clearInterval(newCountdown);
                        timerElement.classList.add('hidden');
                        resendButton.classList.remove('hidden');
                    }
                }, 1000);
            }, 1000);
        });
    </script>

<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TutorFlow - Reset Password</title>

                        "background": "#faf9f5",

                    "borderRadius": {

<style>
        body {
            background-color: theme('colors.paper-50'); /* Fallback if not injected correctly by tailwind in some environments, though we'll use classes */
        }
        
        /* Focus state for inputs */
        input:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: inset 0 0 0 1px theme('colors.primary-fixed');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter-mobile md:p-gutter-desktop">
<!-- Decorative background element for academic feel -->
<div class="fixed inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(theme('colors.paper-300') 1px, transparent 1px); background-size: 24px 24px;"></div>
<main class="w-full max-w-md relative z-10">
<!-- Logo -->
<div class="text-center mb-space-8">
<h1 class="font-display-md text-display-md text-primary">TutorFlow</h1>
<p class="font-body text-body text-on-surface-variant mt-space-1">Academic Workspace</p>
</div>
<!-- Reset Password Card -->
<div class="bg-paper-0 border border-paper-200 rounded-lg p-space-6 md:p-space-8 shadow-[0_4px_12px_rgba(22,33,30,0.06)]">
<h2 class="font-title-lg text-title-lg text-on-surface mb-space-2 text-center">Reset your password</h2>
<p class="font-body text-body text-on-surface-variant text-center mb-space-8">Please enter a new password for your account.</p>
<form action="#" class="space-y-space-4" method="POST">
<!-- New Password Field -->
<div>
<label class="block font-label text-label text-on-surface mb-space-1" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-paper-0 border border-paper-300 rounded font-body text-body text-on-surface px-space-3 py-space-2 transition-all duration-200 placeholder-outline-variant" id="new-password" name="new-password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-space-3 flex items-center text-outline hover:text-on-surface transition-colors" title="Toggle password visibility" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="mt-space-2 space-y-space-1">
<div class="flex gap-space-1 h-1.5 w-full">
<div class="flex-1 bg-success-solid rounded-full"></div>
<div class="flex-1 bg-success-solid rounded-full"></div>
<div class="flex-1 bg-paper-200 rounded-full"></div>
<div class="flex-1 bg-paper-200 rounded-full"></div>
</div>
<p class="font-caption text-caption text-success-solid text-right">Fair</p>
</div>
</div>
<!-- Confirm Password Field -->
<div class="pt-space-2">
<label class="block font-label text-label text-on-surface mb-space-1" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-paper-0 border border-paper-300 rounded font-body text-body text-on-surface px-space-3 py-space-2 transition-all duration-200 placeholder-outline-variant" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-space-4">
<button class="w-full bg-primary text-on-primary font-label text-label py-space-3 px-space-4 rounded flex items-center justify-center gap-space-2 hover:bg-primary-container transition-colors duration-200 focus:ring-2 focus:ring-primary-fixed focus:outline-none" type="submit">
<span>Set new password</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-space-6 text-center">
<a class="font-label text-label text-primary hover:text-primary-container transition-colors inline-flex items-center gap-space-1" href="/login">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
                    Back to log in
                </a>
</div>
</div>
</main>
</body></html>

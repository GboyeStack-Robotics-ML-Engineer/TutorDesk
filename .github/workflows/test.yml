name: Test

# Runs the three test suites in this repo — Django (backend/), pytest
# (whatsapp/), and lint+build (frontend/) — on every push and PR, so a
# regression gets caught automatically instead of depending on someone
# remembering to run `manage.py test` / `pytest` / `npm run build` by hand.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run Django test suite
        # No WHATSAPP_SERVICE_URL / GOOGLE_CLIENT_ID / META creds here on
        # purpose — the test suite mocks every external HTTP call, so a
        # real value would only risk the suite trying to reach out to
        # something that doesn't exist in CI. DATABASE_URL is left unset
        # too — the suite runs fine against the default local SQLite.
        run: python manage.py test core
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
          DJANGO_DEBUG: 'true'

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: whatsapp/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pytest suite
        # PROVIDER defaults to 'dry' — no Meta/Twilio account needed, see
        # META_SETUP.md.
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
